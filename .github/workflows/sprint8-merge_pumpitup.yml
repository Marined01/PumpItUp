name: Build and deploy ASP.Net Core app to Azure Web App - pumpitup

on:
  push:
    branches:
      - sprint8-merge
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: dotnet publish --configuration Release --output ./myapp

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnetapp
          path: myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnetapp

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: pumpitup
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CC4DE440E6354E509C757CC76067D2CB }}
          package: ./myapp
